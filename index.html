<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骨折学習アプリ</title>
    <!-- CSSの読み込み（並列配置用） -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ヘッダー：タイトルとホームボタン -->
        <header>
            <h1 id="header-title">骨折学習</h1>
            <button id="home-btn" class="hidden">ホームへ戻る</button>
        </header>

        <main id="main-content">
            <!-- フェーズ①：カテゴリ選択画面 -->
            <section id="phase1" class="view">
                <h2>学習カテゴリを選択</h2>
                <div id="category-list">
                    <!-- ここにJSでボタンが自動生成されます -->
                </div>
            </section>

            <!-- フェーズ②：穴埋め学習画面 -->
            <section id="phase2" class="view hidden">
                <div id="learning-content">
                    <!-- ここにJSで学習文章と画像が表示されます -->
                </div>
                <button id="go-to-quiz" class="next-btn">確認問題へ進む</button>
            </section>

            <!-- フェーズ③：4択問題画面 -->
            <section id="phase3" class="view hidden">
                <!-- クイズ実行中表示 -->
                <div id="quiz-container">
                    <div id="quiz-progress"></div>
                    <h3 id="quiz-question-text"></h3>
                    <div id="quiz-options">
                        <!-- ここに4択ボタンが生成されます -->
                    </div>
                </div>

                <!-- クイズ結果表示（最初は非表示） -->
                <div id="quiz-result" class="hidden">
                    <h2>結果発表</h2>
                    <p id="score-text"></p>
                    <div class="result-buttons">
                        <button id="retry-mistakes-btn" class="next-btn">間違えた問題を解き直す</button>
                        <button id="back-to-home-btn" class="next-btn secondary">カテゴリ選択に戻る</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 画像タップ時に拡大表示するためのモーダル -->
    <div id="image-modal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <!-- データ格納用オブジェクトの初期化 -->
    <script>window.courseData = {};</script>

    <!-- 各データファイルの読み込み（dataフォルダ内にある想定） -->
    <!-- ファイルを増やしたらここに追加してください -->
    <script src="data/metacarpal.js"></script>
    <script src="data/phalanges.js"></script>
    <script src="data/skull.js"></script>
    <script src="data/cervical.js"></script>
    
    <!-- メインロジックの読み込み（並列配置用） -->
    <script src="script.js"></script>
</body>
</html>
